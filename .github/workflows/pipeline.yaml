name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
  steps:
    - name: Check the code
      uses: actions/checkout@v4
    - name: Build Docker image
      run: docker build -t practice-app:latest

